<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="AlkanSave: a shared family budget tracker in pesos.">
<title>AlkanSave</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A28" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AlkanSave">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load without holding up the first paint; system fonts show until they arrive. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>

<!-- Logo screen while the app and the family book load (hidden by src/splash.js) -->
<div id="splash" class="splash" role="img" aria-label="AlkanSave is loading">
  <picture>
    <source srcset="/icons/splash-dark.webp" media="(prefers-color-scheme: dark)">
    <img src="/icons/splash-light.webp" alt="" width="578" height="387">
  </picture>
</div>

<header class="top">
  <div class="wrap">
    <div class="brand-row">
      <div class="brand"><img class="logo" src="/icons/mark.png" alt="" width="34" height="24">AlkanSave <small>family budget</small></div>
      <div class="top-right">
        <span class="live" id="live" data-s="connecting"><i></i><span>Connecting…</span></span>
        <button class="me" type="button" id="me" data-act="me" aria-label="Your family and account" hidden></button>
      </div>
    </div>
    <div class="month-row">
      <button class="icon-btn" type="button" data-act="prev" aria-label="Previous month">‹</button>
      <h1 id="monthLabel"></h1>
      <button class="icon-btn" type="button" data-act="next" aria-label="Next month">›</button>
    </div>
    <div class="sum" id="sum"></div>
  </div>
</header>
<div class="wrap" id="bannerWrap"></div>
<main class="wrap" id="main"></main>

<button class="fab" id="fab" type="button" data-act="add" aria-label="Add an entry">+</button>

<nav class="tabs" aria-label="Views">
  <div class="wrap">
    <button class="tab" type="button" data-view="daily"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Trans.</button>
    <button class="tab" type="button" data-view="stats"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Stats</button>
    <button class="tab" type="button" data-view="budget"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M4 7l2-3h12l2 3"/><path d="M16 13h2"/></svg>Budget</button>
    <button class="tab" type="button" data-view="accounts"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>Accounts</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="sheet" data-type="expense" novalidate aria-labelledby="sheetTitle">
    <div class="sheet-h">
      <h2 id="sheetTitle">New entry</h2>
      <button class="icon-btn" type="button" data-act="close" aria-label="Close">×</button>
    </div>
    <div class="field" id="forWrap" hidden><span>For</span><div class="to-who" id="f-for" role="radiogroup" aria-label="Whose entry this is"></div></div>
    <div class="seg" role="radiogroup" aria-label="Entry type">
      <input type="radio" name="type" id="t-expense" value="expense" checked><label for="t-expense">Expense</label>
      <input type="radio" name="type" id="t-income" value="income"><label for="t-income">Income</label>
      <input type="radio" name="type" id="t-transfer" value="transfer"><label for="t-transfer">Transfer</label>
    </div>
    <label class="amount-field" for="f-amount"><span>₱</span><input id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Amount in pesos"></label>
    <div class="row2">
      <label class="field" id="dateWrap"><span>Date</span><input type="date" id="f-date" required></label>
      <label class="field"><span id="acctLabel">Account</span><select id="f-acct"></select></label>
    </div>
    <div class="field" id="dayWrap" hidden><span>Repeats on</span>
      <div class="rep-pick">
        <select id="f-rep-by" aria-label="Repeat on a date or a weekday"><option value="date">Date</option><option value="weekday">Weekday</option></select>
        <select id="f-day" aria-label="Day of the month"></select>
        <select id="f-week" aria-label="Which one in the month" hidden></select>
        <select id="f-weekday" aria-label="Day of the week" hidden></select>
      </div>
    </div>
    <div class="field" id="toWrap" hidden><span>To</span>
      <div class="to-who" id="f-towho" role="radiogroup" aria-label="Who gets the money" hidden></div>
      <select id="f-to" aria-label="To account"></select>
    </div>
    <div class="field" id="catWrap"><span>Category</span>
      <button type="button" class="cat-toggle" id="catToggle" data-act="cat-toggle" aria-expanded="false" aria-controls="f-cats"></button>
      <div class="cats" id="f-cats" hidden></div>
    </div>
    <div class="field" id="noteWrap"><label for="f-note">Note</label>
      <div class="note-row">
        <input id="f-note" maxlength="120" placeholder="e.g. Palengke run, Meralco bill">
        <button type="button" class="attach" id="f-attach" data-act="attach" aria-label="Attach a photo or take a picture">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>
        </button>
        <div class="attach-menu" id="attachMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-act="attach-cam">Take a photo</button>
          <button type="button" role="menuitem" data-act="attach-pick">Choose from gallery</button>
        </div>
      </div>
      <input type="file" id="f-file" accept="image/*" multiple hidden>
      <input type="file" id="f-cam" accept="image/*" capture="environment" hidden>
      <div class="photos" id="f-photos" hidden></div>
    </div>
    <label class="field" id="descWrap" hidden><span>Description</span><input id="f-desc" maxlength="200" placeholder="e.g. Official receipt, warranty until Dec 2027"></label>
    <label class="check" id="repeatWrap" hidden><input type="checkbox" id="f-repeat"> Repeat every month</label>
    <label class="field" id="repWhenWrap" hidden><span>Repeats on</span><select id="f-rep"></select></label>
    <p class="meta" id="f-meta" hidden></p>
    <p class="err" id="f-err" role="alert"></p>
    <div class="actions">
      <button class="btn danger" type="button" id="f-del" data-act="del" hidden>Delete</button>
      <div class="right">
        <button class="btn" type="button" data-act="close">Cancel</button>
        <button class="btn primary" type="submit" id="f-save">Save</button>
      </div>
    </div>
  </form>
</div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
